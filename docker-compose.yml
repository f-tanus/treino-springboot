services:
  db:
    container_name: postgres-springboot
    image: postgres:latest
    environment:
      POSTGRES_DB: spring
      POSTGRES_USER: treino
      POSTGRES_PASSWORD: password
      PGDATA: /data/postgres
      TZ: America/Sao_Paulo
    volumes:
      - db:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - db
    restart: unless-stopped

networks:
  db:
    driver: bridge

volumes:
  db:
